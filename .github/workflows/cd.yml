name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: student-internship-tracker-laravel-main
  DEPLOY_DIR: /var/www/tracker

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Vérifier le secret API_URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Secret API_URL manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      # BUILD
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: ${{ env.APP_DIR }}/frontend
        env:
          REACT_APP_API_URL: ${{ secrets.API_URL }}
          CI: "false"
        run: |
          npm ci
          npm run build

      # DEPLOY (local sur la VM 1)
      - name: Deploy frontend
        run: |
          rsync -a --delete ${{ env.APP_DIR }}/frontend/build/ ${{ env.DEPLOY_DIR }}/frontend/

      - name: Deploy backend
        run: |
          rsync -a --delete \
            --exclude '.env' --exclude 'storage' --exclude 'vendor' --exclude '.git' \
            ${{ env.APP_DIR }}/backend/laravel/ ${{ env.DEPLOY_DIR }}/backend/
          cd ${{ env.DEPLOY_DIR }}/backend
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          sudo systemctl reload php8.3-fpm nginx

      # VERIFY
      - name: Verify
        run: |
          sleep 5
          curl -fsS http://localhost/ > /dev/null
          curl -fsS http://localhost/api/health
