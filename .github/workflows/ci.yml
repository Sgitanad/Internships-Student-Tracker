name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-internship-tracker-laravel-main/backend/laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, xml, ctype, json
          tools: composer

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Tests PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          JWT_SECRET: ci-test-secret
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-internship-tracker-laravel-main/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: student-internship-tracker-laravel-main/frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests Jest
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build
        env:
          CI: false
          REACT_APP_API_URL: /api
        run: npm run build

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Lint (ansible-lint)
        run: ansible-lint ansible/playbook.yml
