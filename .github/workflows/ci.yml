name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-internship-tracker-laravel-main/backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, xml, ctype, json
          tools: composer

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Tests PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          JWT_SECRET: ci-test-secret
        run: php artisan test
